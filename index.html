<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistem Pelayanan - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar">
    <h2>SPelayanan</h2>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="users.html">Users</a>
      <a href="supplier.html">Supplier</a>
      <a href="kategori.html">Kategori</a>
      <a href="item.html">Item</a>
      <a href="produk.html">Produk</a>
      <a href="transaksi.html">Transaksi</a>
      <a href="laporan.html">Laporan</a>
      <a href="pengaturan.html">Pengaturan</a>
    </nav>
  </aside>

  <main class="main">
    <header><h1>Dashboard</h1></header>

    <section class="cards">
      <div class="card" id="countUsers"><h3>Users</h3><p>0</p></div>
      <div class="card" id="countProduk"><h3>Produk</h3><p>0</p></div>
      <div class="card" id="countTransaksi"><h3>Transaksi</h3><p>0</p></div>
    </section>

    <section>
      <h2>Ringkasan</h2>
      <p>Demo sistem pelayanan - klik menu di kiri untuk CRUD semua modul.</p>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script>
    // update counters
    document.getElementById('countUsers').querySelector('p').innerText = storage.count('users');
    document.getElementById('countProduk').querySelector('p').innerText = storage.count('produk');
    document.getElementById('countTransaksi').querySelector('p').innerText = storage.count('transaksi');
  </script>
</body>
</html>
